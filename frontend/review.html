<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f0f1f4"><title>研究综述 · Paper Spider</title>
  <meta name="description" content="从论文社区梳理研究路线，回到原文比较方法、实验与局限。">
  <link rel="icon" href="/static/assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/static/assets/fonts/ibm-plex-sans-variable.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="/static/review.css"><script src="/static/community-visuals.js" defer></script>
<script src="/static/workspace-shell.js" defer></script>
<script src="/static/review.js" defer></script>
<link rel="stylesheet" href="/static/workspace-shell.css">
<link rel="stylesheet" href="/static/community-visuals.css">
</head>
<body>
  <a class="skip-link" href="#question">跳到研究问题</a>
  <header data-app-header="review">

</header>
  <div class="review-workspace">
    <aside class="review-sidebar" aria-label="综述导航">



      <div class="sidebar-section"><h3>最近的综述</h3><button id="refresh-history" class="quiet" type="button">刷新</button></div>
      <div id="recent-reviews" class="recent-reviews"><p class="muted">正在读取…</p></div>

    </aside>
    <main id="review-main" class="review-sheet">

      <section class="review-intro" aria-labelledby="review-title"><h1 id="review-title">研究综述</h1><p id="review-scope-meta" class="review-scope-label"></p></section>
      <form id="review-form" class="question-form">
        <label for="question">研究问题</label><textarea id="question" maxlength="1200" required rows="3" placeholder="例如：RAG 评估有哪些研究路线？代表工作和局限有什么差异？"></textarea>
        <div id="focus-route" class="focus-route" hidden><span id="focus-name"></span><button id="clear-focus" class="quiet" type="button">取消限定 ×</button></div>
        <div class="question-tools"><label class="scope-control">范围 <select id="review-scope"><option value="topic">围绕当前主题</option><option value="library">全图谱概览</option></select></label><label class="evidence-mode"><input id="evidence-only" type="checkbox">仅整理原文</label><button id="start-review" class="primary" type="submit">生成综述 <span>↗</span></button></div>
      </form>
      <div id="review-notice" class="notice" role="alert" hidden></div>
      <section id="job-progress" class="progress-panel" aria-live="polite" hidden><div><span class="progress-dot"></span><strong id="progress-title">准备研究范围</strong><span id="progress-count"></span></div><p id="progress-detail">正在准备…</p><ol><li data-stage="planning">选择社区</li><li data-stage="evidence">原文取证</li><li data-stage="route_analysis">分路线分析</li><li data-stage="synthesis">组织综述</li></ol></section>
      <section id="review-result" hidden aria-label="综述结果"></section>
      <section id="community-library" class="community-library" aria-labelledby="community-title"><div class="section-heading"><div><h2 id="community-title">主题群组</h2></div><span id="community-meta">正在读取研究卡片</span></div><div id="community-cards" class="community-grid"></div><section id="community-detail" class="community-deck-panel" aria-label="群组详情" hidden></section><button id="prepare-cards" class="secondary" type="button" hidden>整理研究卡片</button></section>

    </main>
  </div>
  <dialog id="source-dialog" class="source-dialog" aria-labelledby="source-title"><div class="source-top"><span>原文依据</span><button id="close-source" class="close-button" type="button" aria-label="关闭原文">×</button></div><div id="source-content"></div></dialog>
</body>
</html>
